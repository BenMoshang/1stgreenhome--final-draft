name: Deploy to GitHub Pages

on:
  push:
    branches: ["new-design"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref }}

      - name: Setup Node.js
        run: |
          NODE_VERSION=20
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install $NODE_VERSION
          nvm use $NODE_VERSION
          node --version
          npm --version
          echo "$NVM_DIR/versions/node/v$NODE_VERSION/bin" >> $GITHUB_PATH
          export PATH="$NVM_DIR/versions/node/v$NODE_VERSION/bin:$PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Add .nojekyll file
        run: echo > build/.nojekyll

      - name: Deploy to GitHub Pages
        id: deployment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd build
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b new-design || git checkout new-design
          git add -A
          git commit -m "Deploy: ${{ github.sha }}" || exit 0
          git push origin new-design --force

          echo "page_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
